services:
  db:
    image: postgres:16-alpine
    container_name: lexiflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexiflow
      POSTGRES_PASSWORD: lexiflow
      POSTGRES_DB: lexiflow
    ports:
      - "5432:5432"
    volumes:
      - lexiflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiflow -d lexiflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lexiflow_pgdata:
